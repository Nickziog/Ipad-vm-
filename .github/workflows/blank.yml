name: Windows RDP via Cloudflared

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Κωδικός RDP'
        required: true
        default: 'Nick@2026!'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows User Password
        run: |
          net user runneradmin "${{ github.event.inputs.access_password }}"

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Start Cloudflared Tunnel & Show Info
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          Write-Host "=========================================="
          Write-Host "Username: runneradmin"
          Write-Host "Password: ${{ github.event.inputs.access_password }}"
          Write-Host "=========================================="
          .\cloudflared.exe access tcp --hostname rdp.example.com --url localhost:3389
