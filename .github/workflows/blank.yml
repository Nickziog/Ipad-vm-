name: Windows RDP via Pinggy

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Kwdikos RDP'
        required: true
        default: 'Nick@2026!'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows User Password
        run: |
          net user runneradmin "${{ github.event.inputs.access_password }}"

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Start Pinggy Tunnel & Show Info
        run: |
          Invoke-WebRequest -Uri "https://s3.ap-south-1.amazonaws.com/public.pinggy.binaries/cli/v0.2.5/windows/amd64/pinggy.exe" -OutFile "pinggy.exe"
          Start-Process -FilePath ".\pinggy.exe" -ArgumentList "-p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -w 4300 tcp@a.pinggy.io" -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $urls = (Invoke-RestMethod -Uri "http://localhost:4300/urls").urls
          Write-Host "=========================================="
          Write-Host "RDP Address: $urls"
          Write-Host "Username: runneradmin"
          Write-Host "Password: ${{ github.event.inputs.access_password }}"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21500
