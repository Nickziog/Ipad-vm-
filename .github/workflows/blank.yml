name: Windows RDP via Pinggy

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Κωδικός RDP'
        required: true
        default: 'Nick@2026!'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows User Password
        run: |
          net user runneradmin "${{ github.event.inputs.access_password }}"

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Start Pinggy Tunnel & Show Info
        run: |
          Start-Process -FilePath "ssh.exe" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=30 -R0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy_out.txt" -RedirectStandardError "pinggy_err.txt" -WindowStyle Hidden
          for ($i=1; $i -le 15; $i++) {
            Start-Sleep -Seconds 2
            $all = (Get-Content pinggy_out.txt -ErrorAction SilentlyContinue) + (Get-Content pinggy_err.txt -ErrorAction SilentlyContinue)
            if ($all -match "a\.pinggy\.link") { break }
          }
          Write-Host "=========================================="
          Get-Content pinggy_out.txt -ErrorAction SilentlyContinue
          Get-Content pinggy_err.txt -ErrorAction SilentlyContinue
          Write-Host "Username: runneradmin"
          Write-Host "Password: ${{ github.event.inputs.access_password }}"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21500
